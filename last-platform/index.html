r-gradient(145deg,rgba(37,51,57,.98),rgba(18,27,30,.98))}.ending-panel h1{font-size:clamp(32px,6vw,56px);margin:10px 0 12px}.ending-panel p{color:rgba(255,255,255,.68);line-height:1.8}.log-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}.log-list li{border-left:2px solid rgba(255,255,255,.14);padding:6px 0 6px 10px;color:rgba(255,255,255,.62);font-size:12px;line-height:1.5}.log-list li.good{border-color:#68b998}.log-list li.warning{border-color:#d4a450}.log-list li.danger{border-color:#d96f64}@media(max-width:520px){.msf-modal{padding:18px}.save-slot{align-items:flex-start;flex-direction:column}.save-slot button{margin:0 5px 0 0}.intro-panel,.ending-panel{margin-top:24px;padding:24px 20px}.intro-panel h1{font-size:34px}}body{background:radial-gradient(circle at 50% -10%,rgba(255,191,98,.18),transparent 30%),linear-gradient(180deg,#101920,#0b1116 70%)}.rt-shell{width:min(1120px,calc(100% - 30px));min-height:100vh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 0 8px}.rt-header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.rt-header h1{margin:4px 0 0;font-size:40px;letter-spacing:-.04em}.rt-header-actions{display:flex;align-items:center;gap:10px}.rt-header-actions>span{color:rgba(255,255,255,.42);font-size:11px}.rt-timebar{height:4px;overflow:hidden;margin:16px 0;border-radius:999px;background:rgba(255,255,255,.08)}.rt-timebar span{display:block;height:100%;background:linear-gradient(90deg,#e6b45f,#de715f);transition:width .3s linear}.rt-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:14px;margin-bottom:14px;background:rgba(255,255,255,.1)}.rt-metrics .resource-meter{padding:15px 17px;background:#121d23}.rt-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(300px,.6fr);gap:14px}.rt-queue-panel,.rt-control-panel,.rt-brief,.rt-ending{border:1px solid rgba(255,255,255,.1);border-radius:17px;background:rgba(16,28,34,.92)}.rt-queue-panel,.rt-control-panel{padding:18px}.rt-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:13px}.rt-section-head h2{margin:3px 0 0;font-size:22px}.rt-section-head>strong{color:#d8b56c}.rt-section-head>span{border-radius:999px;padding:4px 8px;font-size:9px;font-weight:800}.rt-section-head>span.running{background:rgba(78,183,151,.16);color:#8bd2ba}.rt-section-head>span.paused{background:rgba(226,167,76,.16);color:#e6be79}.rt-queue{display:grid;gap:7px}.rt-customer{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:10px;border-left:2px solid #507b80;border-radius:9px;padding:9px;background:rgba(255,255,255,.035)}.rt-customer.urgent{border-left-color:#e06f62;background:rgba(224,111,98,.07)}.rt-order{color:rgba(255,255,255,.25);font-family:monospace;font-size:11px}.rt-customer-main{min-width:0}.rt-customer-main strong,.rt-customer-main small{display:block}.rt-customer-main small{overflow:hidden;margin-top:3px;color:rgba(255,255,255,.42);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.rt-patience{height:3px;overflow:hidden;margin-top:7px;border-radius:999px;background:rgba(255,255,255,.08)}.rt-patience span{display:block;height:100%;border-radius:inherit;background:#d4ac63;transition:width .25s linear}.rt-reward{min-width:48px;text-align:right}.rt-reward b,.rt-reward small{display:block}.rt-reward b{color:#e5c579}.rt-reward small{color:rgba(255,255,255,.35);font-size:9px}.rt-customer>button{min-width:62px;background:#284148;color:#e9f5f3;font-size:11px}.rt-empty{display:grid;min-height:200px;place-items:center;align-content:center;border:1px dashed rgba(255,255,255,.12);border-radius:12px;color:rgba(255,255,255,.38);text-align:center}.rt-empty span{color:#d8b56c;font-family:Georgia,serif;font-size:28px}.rt-empty p{margin:6px 0 0;font-size:11px}.rt-control-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rt-control-stats div{border-radius:10px;padding:11px;background:rgba(255,255,255,.04)}.rt-control-stats b,.rt-control-stats small{display:block}.rt-control-stats b{font-size:24px}.rt-control-stats small{color:rgba(255,255,255,.4);font-size:9px}.rt-control-actions{display:grid;gap:7px;margin-top:10px}.rt-control-actions button{background:rgba(255,255,255,.067);color:inherit;border:1px solid rgba(255,255,255,.09)}.rt-control-actions .rt-end{background:rgba(223,111,98,.09);color:#eaa49b}.rt-control-actions button:disabled{color:rgba(255,255,255,.25)}.rt-log{margin-top:16px}.rt-log .log-list li{font-size:10px}.rt-brief,.rt-ending{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:880px;margin:9vh auto 0;overflow:hidden}.rt-brief-clock{display:grid;place-items:center;align-content:center;min-height:420px;background:radial-gradient(circle,rgba(244,196,103,.2),transparent 45%),repeating-linear-gradient(90deg,transparent 0 28px,rgba(255,255,255,.04) 29px),#132127}.rt-brief-clock span{font-family:Georgia,serif;font-size:72px;color:#e7bd67;line-height:.8}.rt-brief-clock small{color:rgba(255,255,255,.35);letter-spacing:.2em}.rt-brief-main{padding:38px}.rt-brief h1,.rt-ending h1{margin:7px 0;font-size:48px;letter-spacing:-.04em}.rt-subtitle{color:#e1b55f;font-weight:700}.rt-brief-main>p{color:rgba(255,255,255,.58);line-height:1.8}.rt-brief-legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.rt-brief-legend span{border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 9px;color:rgba(255,255,255,.5);font-size:10px}.rt-button-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.rt-primary{background:#e6bd66;color:#172126;font-weight:900}.rt-ending{display:block;max-width:720px;padding:36px}.rt-ending-clock{display:inline-flex;margin-bottom:20px;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 12px;color:#d8b56c;font-family:monospace;font-size:11px}.rt-ending>p{color:rgba(255,255,255,.58);line-height:1.8}.rt-final-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.rt-final-grid div{border-radius:10px;padding:12px;background:rgba(255,255,255,.05)}.rt-final-grid b,.rt-final-grid span{display:block}.rt-final-grid b{color:#e9c477;font-size:25px}.rt-final-grid span{color:rgba(255,255,255,.4);font-size:9px}@media(max-width:820px){.rt-grid{grid-template-columns:1fr}}@media(max-width:540px){.rt-shell{width:min(100% - 20px,540px);padding-top:14px}.rt-header h1{font-size:31px}.rt-header-actions>span{display:none}.rt-metrics{grid-template-columns:1fr}.rt-customer{grid-template-columns:25px minmax(0,1fr) auto}.rt-customer>button{grid-column:2 / 4;min-height:36px}.rt-brief{grid-template-columns:1fr;margin-top:20px}.rt-brief-clock{min-height:150px}.rt-brief-main,.rt-ending{padding:24px 20px}.rt-brief h1,.rt-ending h1{font-size:36px}.rt-final-grid{grid-template-columns:1fr}}
