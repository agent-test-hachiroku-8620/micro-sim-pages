雨棚撑稳",immediateGain:"设备、备料和队列区域恢复安全，后续故障概率下降。",cost:"一个出餐窗口被占用，现金和队列压力立刻上升。",lastingSignal:"设备维护路线保护第 13、18 事件的收摊能力。",effects:[p("cash",-7),p("freshness",4),p("serviceMargin",10),S("awning_repaired")]},{id:"patch-awning",label:"铺塑料布挡一下，先把当前队伍送走",immediateGain:"保持营业和现金回笼，不必立刻缩短菜单。",cost:"设备受潮隐患扩大，雨势继续加重时会吞掉更多出餐余裕。",lastingSignal:"临时修补路线加重第 13 和第 15 事件的连锁代价。",effects:[p("cash",8),p("freshness",-5),p("serviceMargin",-7),S("awning_patched")]}]},{id:"ev09-borrow-flour",turn:9,stageId:"weather-escalates",title:"隔壁摊主来借三斤原料",setup:"隔壁摊主收不了自己的棚，问能不能先借三斤原料，雨停后再补上。",pressure:"借出去会减少本摊缓冲，却把互助写进街坊关系；只借一小袋能守住库存，也会显得算计。",choices:[{id:"lend-stock",label:"借三斤，约定明天归还或公开抵账",immediateGain:"街坊口碑提升，建立一次可追踪的互助。",cost:"鲜度与份数缓冲下降，下午高峰前可能缺料。",lastingSignal:"互助被记录，第 14、18 事件可出现街坊帮助。",effects:[p("cash",2),p("freshness",-7),p("serviceMargin",-3),p("trust",9),S("lent_stock")]},{id:"protect-stock",label:"只借一小袋并说明自家余量紧张",immediateGain:"保住主要备料与现金流，库存可控。",cost:"关系增益有限，若后续需要帮助会更难开口。",lastingSignal:"谨慎互助信号降低熟客支援，但减少立即资源损失。",effects:[p("cash",5),p("freshness",2),p("trust",-4),S("protected_stock")]}]},{id:"ev10-bulk-leftover-offer",turn:10,stageId:"weather-escalates",title:"有人想把余量一次买走",setup:"一位临时顾客愿意包走全部余量，但要求按很低的总价结算，还说这样能让摊主少淋一会儿雨。",pressure:"整批卖出能迅速清库存并结束排队，却会挤压零散客人；拒绝则要承担鲜度继续下降的风险。",dilemmaId:"premake-vs-cook-to-order",choices:[{id:"clear-leftover-batch",label:"整批成交，明确只卖当前批次",immediateGain:"低总价一次清空余量，库存风险迅速下降并结束排队。",cost:"单份回款被压低，零散顾客被拒，街坊口碑与后续现金缓冲下降。",lastingSignal:"清库存路线减轻第 17 事件，但削弱第 14、18 事件的人情缓冲。",effects:[p("cash",6),p("freshness",4),p("serviceMargin",5),p("trust",-7),S("bulk_cleared")]},{id:"sell-piecemeal",label:"谢绝包单，按份卖给候餐客",immediateGain:"拒绝低总价包单，按份卖出获得更高单份回款并保留街坊关系。",cost:"余料鲜度继续下降，队列延长并压低出餐余裕。",lastingSignal:"分散销售路线加重库存和队列，但保留街坊口碑。",effects:[p("cash",11),p("freshness",-4),p("serviceMargin",-7),p("trust",4),S("piecemeal")]}]},{id:"ev11-helper-stranded",turn:11,stageId:"weather-escalates",title:"帮手被困在桥那头",setup:"来帮忙的人被积水堵在桥那头，短信说还要一阵才能到，摊前却已经排起两条队。",pressure:"等帮手能守住节奏，却会流失现金；自己顶两口炉能清队，也会
